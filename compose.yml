services:
  k6:
    build: k6-image
    environment:
      K6_HOST: http://spacetimedb-client:8000 
    command: ["bash", "-c", "while true; do sleep 3600; done"]
    volumes:
      - ./k6:/k6:ro
      - ./k6/results:/results
    deploy:
      resources:
        limits:
          memory: 42M
  spacetimedb-importer:
    build: 
      context: services/superhero-importer
    ports:
      - "8080:3000"
    environment:
      SPACETIME_DB: "superhero-server"
      SPACETIME_DB_URL: "http://spacetimedb:3000"
    depends_on:
      spacetimedb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 24M
  spacetime-modules:
    build: spacetime-modules
    command: sh -c "echo 'ABOUT TO DEPLOY' && ./spacetimedb-cli publish -s 'http://spacetimedb:3000' --anonymous --module-path superhero-server -y superhero-server && ./spacetimedb-cli logs -s 'http://spacetimedb:3000' -f superhero-server"
    depends_on:
      spacetimedb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  spacetimedb-client:
    build: 
      context: services/superhero-client
    ports:
      - "8000:8000"
    depends_on:
      spacetimedb:
        condition: service_healthy
    environment:
      SPACETIME_DB: "superhero-server"
      SPACETIME_DB_URL: "http://spacetimedb:3000"
    # command: sleep 5 && /spacetimedb-client
    deploy:
      resources:
        limits:
          memory: 350M
  spacetimedb:
    image: clockworklabs/spacetime
    command: start
    ports:
      - "3000:3000"
    volumes:
      - ./spacetime-modules:/modules
    healthcheck: 
      test: "curl -f http://spacetimedb:3000/v1/ping"
      interval: 2s
      timeout: 1m
      retries: 20
    deploy:
      resources:
        limits:
          memory: 200M

